# The retrieval eval's documents and frozen question files (python -m docvault.retrieval_evals).
# The PDFs are never committed. scripts/fetch-public-docs.sh DIR downloads them and checks each sha256, and the
# runner checks them again under --docs DIR. pages is the PDF's page count.
# A question file is frozen once it is listed under cases: the runner refuses one whose sha256 differs.
# A case's docs is the chat scope of every question in it that names none of its own.
