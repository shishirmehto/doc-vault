# One command: docker compose up --build
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment: {POSTGRES_USER: vault, POSTGRES_PASSWORD: vault, POSTGRES_DB: vault}
    # Published for `uv run pytest` on the host, which uses its own database (vault_test).
    ports: ["127.0.0.1:${DB_PORT:-54329}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U vault"], interval: 2s, retries: 30}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30}
  api:
    build: .
    # Open live-status streams never end on their own, so a stop gives requests 5 s and then cancels them.
    # No access log: the API writes its own line per request, with the request id and the route.
    command: uvicorn docvault.api:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5 --no-access-log
    env_file: [{path: .env, required: false}]
    # The fake chat streams its answer a word every 25 ms, so the demo shows streaming without a key.
    environment: {FAKE_STREAM_DELAY_MS: "25", LOG_FORMAT: json}
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [blobs:/data/blobs]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: .
    command: celery -A docvault.tasks worker -Q ingest,llm,celery --concurrency 4 --loglevel info
    env_file: [{path: .env, required: false}]
    environment: {LOG_FORMAT: json}
    volumes: [blobs:/data/blobs]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  beat:
    build: .
    command: celery -A docvault.tasks beat --loglevel info --schedule /tmp/celerybeat-schedule
    env_file: [{path: .env, required: false}]
    environment: {LOG_FORMAT: json}
    depends_on: {redis: {condition: service_healthy}}
  web:
    build: {context: ./web, args: {API_ORIGIN: "http://api:8000"}}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
volumes:
  pgdata:
  blobs:
