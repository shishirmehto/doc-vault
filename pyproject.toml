[project]
name = "docvault"
version = "0.1.0"
description = "Upload documents, get cited insights, chat with them."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.6",
  "celery[redis]>=5.4",
  "pypdf[crypto]>=5",
  "python-docx>=1.1",
  "openai>=3.49,<4",
  "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "reportlab>=4.2",
    "pyyaml>=6",
    "httpx>=0.27",
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # prompts and SQL read better unwrapped
